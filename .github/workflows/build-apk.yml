name: Build Sattari APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Sattari project
        run: |
          unzip -q Sattari-Android-Project.zip
          ls -la SattariAndroid

      - name: Build APK
        working-directory: SattariAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sattari-APK
          path: SattariAndroid/app/build/outputs/apk/debug/app-debug.apk
